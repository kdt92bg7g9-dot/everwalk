body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;color:#26303a;background:radial-gradient(60% 34% at 50% 62%,rgba(255,236,210,.7),rgba(255,236,210,0) 70%),linear-gradient(#34407e 0%,#6b6fb8 38%,#c79fc4 66%,#f3c9b6 100%) fixed;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}

  </div>

    <label>비밀번호 (8자 이상)<input id="u-pw" type="password" autocomplete="new-password" minlength="8" required></label>

    </div>
    <button class="pri" id="u-go" type="submit">계정 만들기</button>
  </form>
  <form id="v-fg" class="col" novalidate hidden>

    <button class="pri" id="g-go" type="submit">재설정 링크 받기</button>
  </form>
  <form id="v-np" class="col" novalidate hidden>

    <button class="pri" id="n-go" type="submit">새 비밀번호 저장</button>
  </form>
  <form id="v-mfa" class="col" novalidate hidden>
    <label>6자리 코드<input id="m-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required></label>

  <div id="msg" role="status" aria-live="polite"></div>
